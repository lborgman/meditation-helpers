<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <pattern id="busy-stripes" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="20" stroke="#E5E7EB" stroke-width="4" />
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#F3F4F6"/>
    <rect width="100%" height="100%" fill="url(#busy-stripes)"/>
    <g transform="translate(100, 100)">
        <circle r="36" fill="#9CA3AF" opacity="0.15"/>
        <circle r="28" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="8 4"/>
        <path d="M-6,-2 L2,-2 L2,10 M-2,-2 L-2,-10" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" fill="none" transform="rotate(30)"/>
        <!--
        <text y="54" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="15" 
          font-weight="600" 
          fill="#6B7280" 
          text-anchor="middle" 
          letter-spacing="0.5">Too busy</text>
        -->
    </g>
</svg>